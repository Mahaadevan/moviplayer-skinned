<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cone — local media player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<main id="stage">
  <movi-player id="video" nohotkeys noerrorscreen playsinline></movi-player>
  <canvas id="viz"></canvas>
  <div id="drop"><div class="cone">▲</div><h1>Drop media here</h1><p>or <label class="link">browse<input id="file" type="file" accept="video/*,audio/*,.mkv,.ts,.m2ts,.flv,.avi,.wmv" multiple hidden></label> · <a class="link" id="url">open URL</a> · everything stays on your device</p></div>
  <div id="title"></div>
</main>
<aside id="list"><header>Playlist</header><ol id="items"></ol></aside>
<footer id="bar">
  <div id="seek"><div id="buf"></div><div id="fill"></div><div id="loop"></div><i id="mA" class="mk">A</i><i id="mB" class="mk">B</i></div>
  <div class="row">
    <button id="prev" title="Previous">⏮</button><button id="play" title="Play/Pause (space)">▶</button><button id="next" title="Next">⏭</button>
    <span id="time">0:00 / 0:00</span>
    <span class="grow"></span>
    <button id="setA" title="Set loop start (a)">A</button><button id="setB" title="Set loop end (b)">B</button><button id="clr" title="Clear loop">✕ loop</button>
    <select id="rate" title="Speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
    <button id="aud" title="Audio track (n)">🎧</button><button id="sub" title="Subtitles (v)">CC</button><button id="asp" title="Aspect ratio (r)">▭</button><button id="rot" title="Rotate (t)">⟳</button><button id="hdr" title="HDR (h)">HDR</button><button id="snap" title="Snapshot (s)">📷</button><button id="pip" title="Picture-in-Picture (p)">⧉</button>
    <button id="mute">🔊</button><input id="vol" type="range" min="0" max="1" step="0.01" value="1">
    <button id="pl" title="Playlist">☰</button><button id="fs" title="Fullscreen (f)">⛶</button>
  </div>
</footer>
<div id="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
