<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Cone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<main id="stage">
  <movi-player id="video" nohotkeys noerrorscreen playsinline></movi-player>
  <canvas id="viz"></canvas>
  <div id="drop"><div class="cone">▲</div><h1>Drop media here</h1><p>or <label class="link">browse<input id="file" type="file" accept="video/*,audio/*,.mkv,.ts,.m2ts,.flv,.avi,.wmv" multiple hidden></label> · <button class="link" id="url" type="button">open URL</button> · everything stays on your device</p></div>
</main>

<div id="ui">
  <header id="top"><span id="title"></span><button class="ib" id="url2" data-i="link" title="Open URL" aria-label="Open URL"></button></header>

  <div id="more" hidden>
    <button class="item" id="aud"><svg data-i="audio"></svg><span>Audio track</span><em id="audv"></em></button>
    <button class="item" id="sub"><svg data-i="subs"></svg><span>Subtitles</span><em id="subv">Off</em></button>
    <button class="item" id="asp"><svg data-i="aspect"></svg><span>Aspect</span><em id="aspv">contain</em></button>
    <button class="item" id="rot"><svg data-i="rotate"></svg><span>Rotate</span><em id="rotv">0°</em></button>
    <button class="item" id="hdr"><svg data-i="hdr"></svg><span>HDR</span><em id="hdrv">Off</em></button>
    <button class="item" id="snap"><svg data-i="cam"></svg><span>Snapshot</span></button>
    <button class="item" id="pip"><svg data-i="pip"></svg><span>Picture-in-Picture</span></button>
  </div>

  <aside id="list" hidden><header><span>Queue</span><button class="ib" id="plx" data-i="x" aria-label="Close"></button></header><ol id="items"></ol></aside>

  <footer id="bar">
    <div id="seek"><div id="buf"></div><div id="loop"></div><div id="fill"></div><i id="mA" class="mk">A</i><i id="mB" class="mk">B</i></div>
    <div class="row">
      <div class="grp"><button class="ib" id="prev" data-i="prev" title="Previous" aria-label="Previous"></button><button id="play" data-i="play" title="Play / Pause (space)" aria-label="Play"></button><button class="ib" id="next" data-i="next" title="Next" aria-label="Next"></button></div>
      <span id="time">0:00 / 0:00</span>
      <span class="grow"></span>
      <div class="grp"><button class="chip" id="setA" title="Loop start (a)">A</button><button class="chip" id="setB" title="Loop end (b)">B</button><button class="ib" id="clr" data-i="x" title="Clear loop" aria-label="Clear loop" hidden></button></div>
      <button class="chip" id="rate" title="Speed">1×</button>
      <div class="grp vol"><button class="ib" id="mute" data-i="vol" title="Mute (m)" aria-label="Mute"></button><input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume"></div>
      <button class="ib" id="mo" data-i="more" title="More" aria-label="More"></button>
      <button class="ib" id="pl" data-i="list" title="Queue" aria-label="Queue"></button>
      <button class="ib" id="fs" data-i="full" title="Fullscreen (f)" aria-label="Fullscreen"></button>
    </div>
  </footer>
</div>
<div id="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
