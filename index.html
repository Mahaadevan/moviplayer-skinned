<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VLC Web Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<link rel="stylesheet" href="style.css">
</head><body>
<header>
  <b>🔶 VLC Web Player</b>
  <form id="urlf"><input id="url" placeholder="Stream / media URL (.m3u8, .mpd, .mp4…)" autocomplete="off"><button>Play URL</button></form>
  <button id="open">Open files…</button>
</header>
<main>
  <div id="stage">
    <div id="drop"><div class="cone">🔶</div><h2>Drop files here</h2><p>Video, audio, images, playlists or .zip</p></div>
    <video id="v" playsinline></video>
    <img id="img" alt="" hidden><div id="art" hidden>♪</div>
    <div id="ov" hidden><div id="msg"></div><div id="bar" hidden><i></i></div><button id="cancel">Cancel</button></div>
    <div id="toast" hidden></div>
  </div>
  <aside>
    <h3>Playlist <span><button id="prev" title="Previous (P)">⏮</button><button id="next" title="Next (N)">⏭</button><button id="shuf" title="Shuffle">🔀</button><button id="rep" title="Repeat: off">🔁</button><button id="clr">Clear</button></span></h3>
    <div id="list"></div>
  </aside>
</main>
<input type="file" id="fi" multiple hidden>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
<script type="module" src="app.js"></script>
</body></html>
